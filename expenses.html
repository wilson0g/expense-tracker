<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXPENSE TRACKER | Expenses</title>
    <link rel="stylesheet" href="thecsspart.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>EXPENSE TRACKER</h1>
        <p>Keep Track of Every Cedi</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="expenses.html" class="active">Expenses</a>
        <a href="summary.html">Summary</a>
    </nav>

    <main>
        <section class="card">
            <h2>Add a New Expense</h2>
            <p>Fill in the details of what you spent money on.</p>

            <form id="expenseForm">

                <label for="expenseName">Expense Name:</label>
                <input type="text" id="expenseName" placeholder="e.g. Lunch" required>

                <label for="expenseAmount">Amount (GH₵):</label>
                <input type="number" id="expenseAmount" min="0.01" step="0.01" placeholder="e.g. 25" required>

                <label for="expenseCategory">Category:</label>
                <select id="expenseCategory" required>
                    <option value="">Select a category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Academic">Academic</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>

                <label for="expenseDate">Date:</label>
                <input type="date" id="expenseDate" required>

                <button type="submit">Add Expense</button>
            </form>

            <p id="expenseMessage"></p>
        </section>

        <section class="card">
            <h2>My Expenses</h2>

            <label for="categoryFilter">Filter by Category:</label>
            <select id="categoryFilter">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Academic">Academic</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Expense</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="expenseTable">
                    </tbody>
                </table>
            </div>

            <h3 id="expenseTotal">Total: GH₵ 0.00</h3>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 EXPENSE TRACKER | Student Expense Tracker</p>
    </footer>

</body>

</html>
